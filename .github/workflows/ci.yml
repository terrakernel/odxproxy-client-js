name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Unit suites only. The live suites (index.test.ts, v2.live.test.ts) skip
      # themselves when their env vars (url/odx_api_key, v2_gateway_url/v2_odx_api_key)
      # are unset, so none are passed here: the gateway behind the TEST_* secrets is
      # not reachable from CI. Run the live suites locally against a real proxy.
      - name: Run tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit
